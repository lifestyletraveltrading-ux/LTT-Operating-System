<!DOCTYPE html>
<html>
<head>
  <title>LTT Operating System</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#f5f7f8;
      color:#1f2933;
    }

    .header {
      background:white;
      padding:15px 30px;
      border-bottom:1px solid #e5e7eb;
      display:flex;
      justify-content:space-between;
    }

    .logo {
      font-weight:600;
      color:#2f5d62;
    }

    .nav {
      background:#2f5d62;
      padding:10px 30px;
    }

    .nav button {
      background:none;
      border:none;
      color:white;
      margin-right:20px;
      cursor:pointer;
      font-size:15px;
    }

    .section {
      display:none;
      padding:30px;
    }

    .active {
      display:block;
    }

    .card {
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }

    .grid {
      display:grid;
      grid-template-columns: repeat(4,1fr);
      gap:15px;
    }

    .kpi {
      background:white;
      padding:20px;
      text-align:center;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }

    /* TRAFFIC LIGHT COLORS */
    .red { background:#fee2e2; border-left:6px solid #ef4444; }
    .yellow { background:#fef3c7; border-left:6px solid #f59e0b; }
    .blue { background:#dbeafe; border-left:6px solid #3b82f6; }
